spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: apigateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apigateway}
    username: ${DB_USERNAME:apigateway}
    password: ${DB_PASSWORD:apigateway}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_A_LONG_RANDOM_BASE64_SECRET_AT_LEAST_32_BYTES}
  expiration-minutes: 30
  refresh-expiration-minutes: 10080

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:admin@creditbank.ru}
    password: ${ADMIN_PASSWORD:AdminPass123}

services:
  credit-operations:
    base-url: ${CREDIT_OPERATIONS_URL:http://localhost:8081}